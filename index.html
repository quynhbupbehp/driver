<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Tool & Driver Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-dark {
      background-color: #111827;
      border: 1px solid #1f2937;
    }
    .card-dark:hover {
      border-color: #38bdf8;
      background-color: #1f2937/60;
    }
    /* Style cho Tab Active */
    .tab-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
  </style>
  <script>
    // Vô hiệu hóa tính năng xin quyền Geolocation để tránh trình duyệt tự bật popup
    if (navigator.geolocation) {
      delete navigator.geolocation;
    }
  </script>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto space-y-8">

  <!-- Thông tin Facebook & Hệ thống -->
  <section>
    <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
      <i class="fa-solid fa-tower-broadcast text-sky-400"></i> TOOL MOBILE + PC - QUYNH BUP BE
    </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      
      <!-- Box Facebook -->
      <a href="https://www.facebook.com/kimchimobile2019" target="_blank" class="card-dark p-4 rounded-xl flex items-center gap-4 transition-all hover:border-sky-500 group">
        <div class="bg-blue-950/60 p-3 rounded-lg text-blue-400 border border-blue-800/50 group-hover:bg-blue-600 group-hover:text-white transition-all">
          <i class="fa-brands fa-facebook text-xl"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400">DỊCH VỤ PHẦN MỀM ONLINE</div>
          <div class="font-bold text-sky-400 group-hover:text-sky-300">ĐẶNG VĂN QUỴNH</div>
        </div>
      </a>

      <!-- Box Vị trí gộp (Dòng 1: Quận/Huyện, Dòng 2: TP/Tỉnh) -->
      <div class="card-dark p-4 rounded-xl flex items-center gap-4">
        <div class="bg-sky-950/50 p-3 rounded-lg text-sky-400 border border-sky-800/40">
          <i class="fa-solid fa-map-location-dot text-xl"></i>
        </div>
        <div class="flex flex-col justify-center space-y-0.5">
          <div id="ip-city" class="font-bold text-gray-200">Đang tải...</div>
          <div id="ip-region" class="font-bold text-gray-200">Đang tải...</div>
        </div>
      </div>

      <!-- Box Tổ chức -->
      <div class="card-dark p-4 rounded-xl flex items-center gap-4">
        <div class="bg-sky-950/50 p-3 rounded-lg text-sky-400 border border-sky-800/40">
          <i class="fa-solid fa-building text-xl"></i>
        </div>
        <div>
          <div class="text-xs text-gray-400">Đang Dùng Mạng</div>
          <div id="ip-isp" class="font-bold text-gray-200">Đang tải...</div>
        </div>
      </div>

    </div>
  </section>

  <!-- Hệ thống Tab phân loại -->
  <section>
    <!-- Thanh Chuyển Tab -->
    <div class="flex flex-wrap gap-2 md:gap-3 border-b border-gray-800 pb-4 mb-6">
      <button onclick="switchTab('mobile')" id="tab-mobile" class="tab-btn active px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button"></i> Tool Mobile
      </button>
      <button onclick="switchTab('driver')" id="tab-driver" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-hard-drive"></i> Driver
      </button>
      <button onclick="switchTab('rent')" id="tab-rent" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-key"></i> Thuê Tool
      </button>
      <button onclick="switchTab('testpoint')" id="tab-testpoint" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-microchip"></i> Testpoint
      </button>
      <button onclick="switchTab('box_setup')" id="tab-box_setup" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-box-archive"></i> Box Setup
      </button>
      <button onclick="switchTab('pc')" id="tab-pc" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-desktop"></i> Máy Tính
      </button>
      <button onclick="switchTab('banking')" id="tab-banking" class="tab-btn px-4 py-2.5 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-building-columns"></i> Ngân Hàng
      </button>
    </div>

    <!-- Lưới danh sách Tool (4 cột) -->
    <div id="toolGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <!-- Dữ liệu Tool sẽ tự động nạp từ file JSON theo Tab tương ứng -->
    </div>
  </section>

  <script>
    // Hàm xử lý chỉ đổi Chi Linh / Chí Linh -> Nam Sách, giữ nguyên các địa danh khác
    function formatCityName(city) {
      if (!city) return 'Nam Sách';
      if (/Chi\s*Linh/gi.test(city)) {
        return 'Nam Sách';
      }
      return city;
    }

    // Hàm rút gọn "Thành Phố" / "Thanh Pho" thành "TP"
    function formatRegionName(region) {
      if (!region) return 'TP Hai Phong';
      return region
        .replace(/Thành\s+Phố/gi, 'TP')
        .replace(/Thanh\s+Pho/gi, 'TP');
    }

    // 1. Chỉ dùng API IP công cộng
    function loadIpLocation() {
      fetch('https://ipwho.is/')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            document.getElementById('ip-city').innerText = formatCityName(data.city);
            document.getElementById('ip-region').innerText = formatRegionName(data.region);
            document.getElementById('ip-isp').innerText = (data.connection && data.connection.isp) ? data.connection.isp : (data.org || 'N/A');
          } else {
            fetchIpFallback();
          }
        })
        .catch(() => fetchIpFallback());
    }

    function fetchIpFallback() {
      document.getElementById('ip-city').innerText = 'Nam Sách';
      document.getElementById('ip-region').innerText = 'TP Hai Phong';
      document.getElementById('ip-isp').innerText = 'Nội địa (ISP)';
    }

    // Chạy tải vị trí qua IP
    loadIpLocation();

    // 2. Tải danh sách Tool từ file data.json
    let toolsData = {
      mobile: [],
      driver: [],
      rent: [],
      testpoint: [],
      box_setup: [],
      pc: [],
      banking: []
    };
    let currentTab = 'mobile';

    async function loadTools() {
      try {
        const response = await fetch('data.json');
        toolsData = await response.json();
        renderTools(currentTab);
      } catch (error) {
        console.error("Lỗi khi tải dữ liệu tool:", error);
      }
    }

    // 3. Hiển thị danh sách ra màn hình theo Tab
    function renderTools(category) {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = '';

      const list = toolsData[category] || [];

      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">Chưa có dữ liệu trong mục này.</div>';
        return;
      }

      list.forEach((tool, index) => {
        const itemHtml = `
          <a href="${tool.url}" target="_blank" class="card-dark p-3 rounded-xl flex items-center transition-all hover:text-sky-400 group">
            <div class="font-medium text-gray-200 group-hover:text-sky-400 text-sm truncate">
              <span class="text-gray-400 group-hover:text-sky-400 mr-1.5 font-normal">${index + 1}.</span>${tool.name}
            </div>
          </a>
        `;
        grid.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    // 4. Chuyển đổi qua lại giữa các Tab
    function switchTab(category) {
      currentTab = category;
      
      // Xóa active tất cả các tab
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      // Active tab hiện tại
      document.getElementById(`tab-${category}`).classList.add('active');
      
      // Render lại danh sách
      renderTools(category);
    }

    loadTools();
  </script>
</body>
</html>
