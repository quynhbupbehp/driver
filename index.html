<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Tool & Driver Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-dark {
      background-color: #111827;
      border: 1px solid #1f2937;
    }
    .card-dark:hover {
      border-color: #38bdf8;
      background-color: #1f2937/60;
    }
    /* Style cho Tab Active */
    .tab-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
  </style>
  <script>
    // Vô hiệu hóa tính năng xin quyền Geolocation để tránh trình duyệt tự bật popup
    if (navigator.geolocation) {
      delete navigator.geolocation;
    }
  </script>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto space-y-6">

  <!-- Tiêu đề trang -->
  <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
    <i class="fa-solid fa-tower-broadcast text-sky-400"></i> TOOL MOBILE + PC - QUYNH BUP BE
  </h2>

  <!-- Container bao bọc thu gọn vừa bằng tổng chiều ngang thanh Tab -->
  <div class="w-fit max-w-full space-y-4">
    
    <!-- Hàng trên: 4 ô thông tin (Chữ & Icon căn giữa ô) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-2.5 w-full">
      
      <!-- Box Facebook -->
      <a href="https://www.facebook.com/kimchimobile2019" target="_blank" class="card-dark p-2 px-3 rounded-xl flex items-center justify-center text-center gap-2.5 transition-all hover:border-sky-500 group h-[48px]">
        <div class="bg-blue-950/60 p-1.5 rounded-lg text-blue-400 border border-blue-800/50 group-hover:bg-blue-600 group-hover:text-white transition-all shrink-0">
          <i class="fa-brands fa-facebook text-sm"></i>
        </div>
        <div class="whitespace-nowrap flex flex-col justify-center items-center">
          <div class="text-[10px] text-gray-400 leading-tight">DỊCH VỤ PHẦN MỀM ONLINE</div>
          <div class="font-bold text-sky-400 group-hover:text-sky-300 text-xs">ĐẶNG VĂN QUỴNH</div>
        </div>
      </a>

      <!-- Box Vị trí gộp (Nam Sách - TP Hải Phòng) -->
      <div class="card-dark p-2 px-3 rounded-xl flex items-center justify-center text-center gap-2.5 h-[48px]">
        <div class="bg-sky-950/50 p-1.5 rounded-lg text-sky-400 border border-sky-800/40 shrink-0">
          <i class="fa-solid fa-map-location-dot text-sm"></i>
        </div>
        <div class="flex flex-col justify-center items-center whitespace-nowrap">
          <div id="ip-city" class="font-bold text-gray-200 text-xs leading-tight">Đang tải...</div>
          <div id="ip-region" class="font-bold text-gray-200 text-xs leading-tight">Đang tải...</div>
        </div>
      </div>

      <!-- Box Đang Dùng Mạng -->
      <div class="card-dark p-2 px-3 rounded-xl flex items-center justify-center text-center gap-2.5 h-[48px]">
        <div class="bg-sky-950/50 p-1.5 rounded-lg text-sky-400 border border-sky-800/40 shrink-0">
          <i class="fa-solid fa-building text-sm"></i>
        </div>
        <div class="whitespace-nowrap flex flex-col justify-center items-center">
          <div class="text-[10px] text-gray-400 leading-tight">Đang Dùng Mạng</div>
          <div id="ip-isp" class="font-bold text-gray-200 text-xs">Đang tải...</div>
        </div>
      </div>

      <!-- Box Địa Chỉ IP Mạng (Click vào để Copy IP) -->
      <div onclick="copyIpAddress()" class="card-dark p-2 px-3 rounded-xl flex items-center justify-center text-center gap-2.5 cursor-pointer transition-all hover:border-sky-400 group relative h-[48px]">
        <div class="bg-sky-950/50 p-1.5 rounded-lg text-sky-400 border border-sky-800/40 shrink-0 group-hover:bg-sky-600 group-hover:text-white transition-all">
          <i class="fa-solid fa-network-wired text-sm"></i>
        </div>
        <div class="whitespace-nowrap flex flex-col justify-center items-center">
          <div class="text-[10px] text-gray-400 leading-tight flex items-center justify-center gap-1">
            <span>Địa Chỉ IP Mạng</span>
            <i class="fa-regular fa-copy text-[9px] text-sky-400 opacity-80"></i>
          </div>
          <div id="ip-address" class="font-bold text-gray-200 text-xs group-hover:text-sky-300">Đang tải...</div>
        </div>
        <!-- Thông báo copy nhỏ -->
        <span id="copy-toast" class="hidden absolute -top-2 right-2 bg-sky-600 text-white text-[9px] px-1 py-0.5 rounded shadow">Đã chép!</span>
      </div>

    </div>

    <!-- Hàng dưới: Thanh Chuyển Tab -->
    <div class="flex flex-wrap items-center gap-2 md:gap-2.5 border-b border-gray-800 pb-4 w-full">
      <button onclick="switchTab('mobile')" id="tab-mobile" class="tab-btn active px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button"></i> Tool Mobile
      </button>
      <button onclick="switchTab('driver')" id="tab-driver" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-hard-drive"></i> Driver
      </button>
      <button onclick="switchTab('rent')" id="tab-rent" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-key"></i> Thuê Tool
      </button>
      <button onclick="switchTab('testpoint')" id="tab-testpoint" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-microchip"></i> Testpoint
      </button>
      <button onclick="switchTab('box_setup')" id="tab-box_setup" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-box-archive"></i> Box Setup
      </button>
      <button onclick="switchTab('pc')" id="tab-pc" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-desktop"></i> Máy Tính
      </button>
      <button onclick="switchTab('banking')" id="tab-banking" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium border border-gray-800 bg-[#111827] text-gray-300 hover:text-white transition-all flex items-center gap-2">
        <i class="fa-solid fa-building-columns"></i> Ngân Hàng
      </button>
    </div>

  </div>

  <!-- Lưới danh sách Tool (4 cột) -->
  <section class="pt-2">
    <div id="toolGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <!-- Dữ liệu Tool sẽ tự động nạp từ file JSON theo Tab tương ứng -->
    </div>
  </section>

  <script>
    // Hàm xử lý chỉ đổi Chi Linh / Chí Linh -> Nam Sách
    function formatCityName(city) {
      if (!city) return 'Nam Sách';
      if (/Chi\s*Linh/gi.test(city)) {
        return 'Nam Sách';
      }
      return city;
    }

    // Hàm rút gọn "Thành Phố" / "Thanh Pho" thành "TP" và "Hai Phong" -> "Hải Phòng"
    function formatRegionName(region) {
      if (!region) return 'TP Hải Phòng';
      let formatted = region
        .replace(/Thành\s+Phố/gi, 'TP')
        .replace(/Thanh\s+Pho/gi, 'TP')
        .replace(/Hai\s+Phong/gi, 'Hải Phòng');
      return formatted;
    }

    // 1. Tải thông tin vị trí & ISP
    function loadIpLocation() {
      fetch('https://ipwho.is/')
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            document.getElementById('ip-city').innerText = formatCityName(data.city);
            document.getElementById('ip-region').innerText = formatRegionName(data.region);
            document.getElementById('ip-isp').innerText = (data.connection && data.connection.isp) ? data.connection.isp : (data.org || 'N/A');
          } else {
            fetchIpFallback();
          }
        })
        .catch(() => fetchIpFallback());

      fetchPingEuIp();
    }

    function fetchPingEuIp() {
      fetch('https://port-chk.ping.eu/json')
        .then(res => res.json())
        .then(data => {
          if (data && data.ip) {
            document.getElementById('ip-address').innerText = data.ip;
          } else {
            fetchIpAddressFallback();
          }
        })
        .catch(() => fetchIpAddressFallback());
    }

    function fetchIpAddressFallback() {
      fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => {
          document.getElementById('ip-address').innerText = data.ip || 'N/A';
        })
        .catch(() => {
          document.getElementById('ip-address').innerText = 'N/A';
        });
    }

    function fetchIpFallback() {
      document.getElementById('ip-city').innerText = 'Nam Sách';
      document.getElementById('ip-region').innerText = 'TP Hải Phòng';
      document.getElementById('ip-isp').innerText = 'VNPT Corp';
    }

    // Copy IP khi bấm vào ô Địa chỉ IP
    function copyIpAddress() {
      const ipText = document.getElementById('ip-address').innerText;
      if (ipText && ipText !== 'Đang tải...' && ipText !== 'N/A') {
        navigator.clipboard.writeText(ipText).then(() => {
          const toast = document.getElementById('copy-toast');
          toast.classList.remove('hidden');
          setTimeout(() => toast.classList.add('hidden'), 1500);
        });
      }
    }

    // Chạy tải vị trí & IP
    loadIpLocation();

    // 2. Tải danh sách Tool từ file data.json
    let toolsData = {
      mobile: [],
      driver: [],
      rent: [],
      testpoint: [],
      box_setup: [],
      pc: [],
      banking: []
    };
    let currentTab = 'mobile';

    async function loadTools() {
      try {
        const response = await fetch('data.json');
        toolsData = await response.json();
        renderTools(currentTab);
      } catch (error) {
        console.error("Lỗi khi tải dữ liệu tool:", error);
      }
    }

    // 3. Hiển thị danh sách ra màn hình theo Tab
    function renderTools(category) {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = '';

      const list = toolsData[category] || [];

      if (list.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">Chưa có dữ liệu trong mục này.</div>';
        return;
      }

      list.forEach((tool, index) => {
        const itemHtml = `
          <a href="${tool.url}" target="_blank" class="card-dark p-2.5 rounded-xl flex items-center transition-all hover:text-sky-400 group">
            <div class="font-medium text-gray-200 group-hover:text-sky-400 text-sm truncate">
              <span class="text-gray-400 group-hover:text-sky-400 mr-1.5 font-normal">${index + 1}.</span>${tool.name}
            </div>
          </a>
        `;
        grid.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    // 4. Chuyển đổi qua lại giữa các Tab
    function switchTab(category) {
      currentTab = category;
      
      // Xóa active tất cả các tab
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      // Active tab hiện tại
      document.getElementById(`tab-${category}`).classList.add('active');
      
      // Render lại danh sách
      renderTools(category);
    }

    loadTools();
  </script>
</body>
</html>
